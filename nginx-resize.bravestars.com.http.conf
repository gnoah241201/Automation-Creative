upstream resize_video_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream resize_video_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name resize.bravestars.com;

    client_max_body_size 500M;

    # Optional: restrict access to office/VPN IPs.
    # Remove the leading # and replace CIDRs with your real egress IP ranges.
    # allow 203.0.113.0/24;
    # allow 198.51.100.10/32;
    # deny all;

    location /api/ {
        proxy_pass http://resize_video_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        client_body_timeout 600s;
    }

    location / {
        proxy_pass http://resize_video_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        client_body_timeout 600s;
    }
}
