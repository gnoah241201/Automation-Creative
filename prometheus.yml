global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ResizeVideo app metrics
  - job_name: 'resize-video'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Ubuntu server system metrics (CPU, Memory, Disk, Network, etc.)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    scrape_timeout: 10s
